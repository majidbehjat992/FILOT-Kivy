name: Build FILOT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.33"


      - name: Build APK
        run: |
          yes | buildozer android debug


      - name: Show APK files
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -name "*.apk" -type f -print || true
          echo "===== BIN ====="
          ls -lah bin || true


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FILOT-APK
          path: bin/*.apk
