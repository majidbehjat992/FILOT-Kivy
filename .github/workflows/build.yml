name: Build FILOT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Get source code
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # 3. System dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # --------------------------------------------------
      # 4. Install Buildozer
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install cython==0.29.33


      # --------------------------------------------------
      # 5. Prepare Android SDK licenses
      # --------------------------------------------------
      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"

          mkdir -p "$HOME/.android"

          touch "$HOME/.android/repositories.cfg"

          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # 6. Accept Android licenses
      # --------------------------------------------------
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # 7. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          buildozer android debug


      # --------------------------------------------------
      # 8. Show generated files
      # --------------------------------------------------
      - name: Show APK files
        if: always()
        run: |
          echo "======================================"
          echo "BIN DIRECTORY"
          echo "======================================"

          ls -lah bin || true

          echo "======================================"
          echo "ALL APK FILES"
          echo "======================================"

          find . -name "*.apk" -type f -print || true


      # --------------------------------------------------
      # 9. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FILOT-APK
          path: bin/*.apk
